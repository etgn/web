\nSimpan catatan ke dev_notes, deploy, beri alamat situs.", "branch": "deploy langsung", "pre": "P1-B selesai dan API key Groq siap (Persiapan).", "steps": ["Buka chat BARU di Claude, tempel prompt (tombol Salin).", "Balas ya bila Claude minta persetujuan SQL. Ketuk Izinkan pada permintaan konektor Supabase/Vercel.", "Isi secret GROQ_API_KEY di Supabase > Edge Functions > Secrets, lalu balas \"sudah\".", "Buka alamat situs dari Claude di browser HP.", "Tes: Tanya \"buat fungsi JavaScript penjumlahan\": jawaban tampil.", "Tes: Tombol Salin kode berfungsi. Pesan ke-21 dalam sejam ditolak.", "Lolos: centang kartu. Gagal: tempel pesan error ke chat yang sama."], "wave": 4}, {"id": "P1-C", "acc": "P1", "title": "Audit dan rilis", "body": "Awal: baca dev_notes dan daftar file deployment terakhir.\nAudit dan rilis.\n- get_advisors (security dan performance): perbaiki semua WARN/ERROR.\n- Pastikan semua tabel RLS aktif; ringkas daftar pg_policies dan bucket policy; cari policy yang terlalu longgar.\n- Pastikan tidak ada service_role atau rahasia di file deployment (baca file lalu cari).\n- Cek semua tautan menu mengarah ke halaman yang ada.\n- Tambah halaman /tentang (fitur, batas layanan gratis, cara lapor).\nLaporkan yang masih kurang, lalu deploy.\nSimpan catatan ke dev_notes, deploy, beri alamat situs.", "branch": "deploy langsung", "pre": "semua tahap 0-4 selesai.", "steps": ["Buka chat BARU di Claude, tempel prompt (tombol Salin).", "Balas ya bila Claude minta persetujuan SQL. Ketuk Izinkan pada permintaan konektor Supabase/Vercel.", "Buka alamat situs dari Claude di browser HP.", "Tes: Buka tiap menu dari beranda: tidak ada halaman kosong atau 404.", "Tes: Daftar, simpan kode, buat dan terbitkan website, kirim chat.", "Lolos: centang kartu. Gagal: tempel pesan error ke chat yang sama."], "wave": 5}], "tut": [{"id": "s1", "t": "Hubungkan Supabase dan Vercel ke Claude", "who": "SEKALI", "req": "WAJIB", "when": "Sebelum mulai", "steps": ["Di aplikasi Claude buka pengaturan Connectors (nama menu bisa berbeda). Hubungkan Supabase dan Vercel, izinkan akses akunmu.", "Uji di chat baru: tulis \"daftar project Supabase saya\" dan \"daftar project Vercel saya\". Keduanya harus menjawab (kosong boleh)."]}, {"id": "s2", "t": "Akun dan project Supabase", "who": "SEKALI", "req": "WAJIB", "when": "Sebelum mulai", "steps": ["Buka supabase.com > Start your project > daftar (email atau GitHub).", "Bila diminta Organization: nama bebas, tipe Personal, plan Free.", "New project: Name devhub, Database password klik Generate lalu SIMPAN, Region Southeast Asia (Singapore), plan Free. Tunggu sekitar 2 menit.", "Project Settings > General: catat Reference ID. Isi nama project dan Reference ID di kotak Pengaturan (tab ini, di atas).", "Authentication > Providers: pastikan Email aktif. Selama pengembangan matikan Confirm email.", "Setelah P1-A selesai: Authentication > URL Configuration: Site URL = alamat situs, tambah Redirect URL alamat/**."]}, {"id": "s3", "t": "Akun Vercel", "who": "SEKALI", "req": "WAJIB", "when": "Sebelum mulai", "steps": ["Buka vercel.com > Sign Up > paket Hobby (gratis). Project dibuat otomatis oleh Claude di P1-A.", "Bila situs yang sudah jadi malah meminta login Vercel: Project devhub > Settings > Deployment Protection, matikan untuk Production."]}, {"id": "s4", "t": "Judge0 di RapidAPI (C, C++, Java)", "who": "SEKALI", "req": "OPSIONAL", "when": "Sebelum P2-C", "steps": ["rapidapi.com > Sign Up. Cari Judge0 CE dan subscribe paket Basic gratis (batas harian terbatas, cek terbaru).", "Salin X-RapidAPI-Key. Simpan sebagai secret RAPIDAPI_KEY di Supabase > Edge Functions > Secrets saat Claude memintanya."]}, {"id": "s5", "t": "API key AI gratis (Groq)", "who": "SEKALI", "req": "OPSIONAL", "when": "Sebelum P5-C", "steps": ["console.groq.com > API Keys > Create API Key (tampil sekali).", "Simpan sebagai secret GROQ_API_KEY di Supabase > Edge Functions > Secrets saat Claude memintanya."]}], "kontrak": "KONTRAK DEVHUB (taati di semua tugas)\nSaya = P__. Tugas saya = bagian TUGAS di bawah.\n\n[PROYEK] DevHub: situs komunitas developer gratis. Statis TANPA build: HTML + CSS + JavaScript (ES module). Pustaka lewat CDN dengan versi dipatok (pilih rilis yang berumur lebih dari 14 hari). Backend: Supabase (Auth, Postgres + RLS, Storage, Realtime, Edge Functions). Hosting: Vercel (satu project \"devhub\"). Bahasa antarmuka Indonesia, mobile-first, tema gelap/terang.\n\n[FOLDER] Tulis hanya di folder sendiri.\nP1: index.html login.html profile.html 404.html vercel.json assets/ (app.css supabase.js ui.js) halaman /tentang\nP2: playground/ projects/ api-docs/ supabase/functions run-code dan api\nP3: templates/ sites/ builder/ s/\nP4: learn/ tools/\nP5: feed/ chat/ ai/ dan fungsi ai\nMenu: daftar NAV di assets/ui.js; modul lain hanya menambah satu baris miliknya.\n\n[ANTARMUKA TETAP]\n- assets/supabase.js mengekspor sb (klien) dan getUser(). assets/ui.js mengekspor mountNav(), toast(msg), esc(teks). Halaman memakai <script type=\"module\"> dan import dari /assets/.\n- Tabel P1: profiles(id = auth.users.id, username unik, display_name, bio, avatar_url). Kolom pemilik di tabel lain: user_id default auth.uid().\n- Semua tabel: RLS aktif sejak dibuat dan policy jelas.\n\n[ATURAN SUPABASE] Project \"<NAMA-DEV>\" (id: <ID-DEV>) SAJA.\n- Jalankan SQL lewat apply_migration, nama bernomor (mis. 003_projects), idempoten bila bisa. Tampilkan ringkasan SQL (maks 10 baris) dan tunggu saya menjawab \"ya\".\n- DILARANG: DROP, TRUNCATE, DELETE tanpa WHERE, membuat/menghapus project, mengubah tabel modul lain.\n- Setelah migrasi jalankan get_advisors (security) dan perbaiki peringatan RLS.\n- Di front-end hanya publishable/anon key. service_role dan rahasia lain JANGAN masuk file atau chat. Rahasia hanya di Edge Function lewat Supabase Secrets (saya isi di dashboard).\n- Edge Function: deploy_edge_function, verify_jwt true kecuali endpoint publik yang memverifikasi key sendiri.\n- Catatan modul (maks 8 baris: tabel, halaman, fungsi, BUTUH dari tahap lain) disimpan di tabel dev_notes(module, note). Awal tugas: baca dev_notes dengan execute_sql.\n\n[ATURAN VERCEL] Project \"devhub\" SAJA.\n- Deploy = create_deployment, target production, framework null (statis).\n- Setiap deploy HARUS memuat SEMUA file yang sudah ada. Sebelum deploy: cari deployment production terakhir (list_deployments), ambil daftar file (list_deployment_files), pertahankan file modul lain (pakai referensi sha bila tersedia, bila tidak baca isinya dengan get_deployment_file_contents dan sertakan ulang). Ubah hanya file milikmu.\n- Jangan mengubah env, domain, atau setting. Deploy gagal: baca log, perbaiki; bila perlu request_rollback.\n- Setelah deploy berikan alamat situs.\n\n[ATURAN JAWABAN]\nKerjakan sendiri lewat konektor. Jangan menulis ulang isi file di chat. Jangan bertanya balik kecuali buntu: putuskan sesuai kontrak dan catat asumsi. Laporan akhir maks 8 baris.\n[AKHIR KONTRAK]", "rit": ["Buka chat BARU di Claude (kartu Berikutnya di Roadmap).", "Tekan Salin prompt dan tempel. KONTRAK sudah ikut di dalamnya.", "Bila Claude menampilkan ringkasan SQL, balas ya. Ketuk Izinkan pada permintaan konektor.", "Claude men-deploy dan memberi alamat. Buka di browser HP dan lakukan TES di kartu.", "Gagal: tempel pesan error atau deskripsi masalah di chat yang sama. Lolos: centang kartu.", "Lanjut ke prompt berikutnya di chat baru."], "faq": [["Claude terpotong atau berhenti", "Ketik: lanjut"], ["Batas pemakaian gratis habis", "Tunggu reset, atau pakai akun Claude lain (hubungkan konektor lagi). Di chat baru ketik: lanjutkan ID-PROMPT, baca dev_notes dan file deployment terakhir."], ["Halaman lama hilang setelah deploy", "Claude lupa menyertakan file lama. Minta: rollback ke deployment sebelumnya, lalu ulangi dan tekankan aturan Vercel di KONTRAK."], ["Situs minta login Vercel", "Matikan Deployment Protection untuk Production (Persiapan > Vercel)."], ["Tidak bisa login saat tes", "Cek Email auth aktif, Confirm email mati, Site URL dan Redirect URL berisi alamat situs."], ["Konektor tidak muncul atau ditolak", "Hubungkan ulang di Connectors dan ulangi uji di Persiapan."], ["Perlu akun uji kedua", "Pakai tab penyamaran atau browser lain di HP."]]}</script>
<script>
const D=JSON.parse(document.getElementById("d").textContent),K="devhub-v8";let S={},tab="r",flt="all",O={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}S.p=S.p||{};S.s=S.s||{};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const has=o=>Object.values(o.p||{}).some(v=>Object.values(v).some(Boolean))||Object.values(o.s||{}).some(Boolean);
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const E=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cp=t=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()});};
const kt=()=>{const c=S.cfg||{};return D.kontrak.replace("<NAMA-DEV>",c.n||"<NAMA-DEV>").replace("<ID-DEV>",c.i||"<ID-DEV>")};
const mk=p=>"Saya = "+p.acc+".\n\n=== KONTRAK ===\n"+kt().replace("Saya = P__","Saya = "+p.acc)+"\n\n=== TUGAS "+p.id+" ===\n"+p.body;
function toast(m){let t=document.getElementById("tt");if(!t){t=document.createElement("div");t.id="tt";document.body.appendChild(t)}t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,3000)}
function doCopy(id){const p=D.prompts.find(p=>p.id==id);cp(mk(p));const o=S.p[id]=S.p[id]||{};o[0]=true;sv();draw();toast("Prompt "+id+" tersalin. Tempel di chat baru Claude."+(id=="P1-A"&&!(S.cfg&&S.cfg.n&&S.cfg.i)?" PERHATIAN: isi Pengaturan di tab Persiapan dulu.":""))}
function nxt(){const p=D.prompts.find(p=>!(S.p[p.id]&&[0,1,2].every(i=>S.p[p.id][i])));if(!p)return '<div class="g c">Semua selesai.</div>';return '<div class="g c nx"><div class="m">BERIKUTNYA · '+E(D.waves[p.wave])+'</div><b>'+E(p.id)+' · '+E(p.title)+'</b><div class="row" style="margin-top:10px"><button class="p" data-cp="'+p.id+'">Salin prompt '+p.id+'</button></div></div>'}
const L=["Prompt dikirim","Tes lolos","Catatan + merge"];
function prog(){let n=D.prompts.length*3+D.tut.length,d=0;D.prompts.forEach(p=>{const x=S.p[p.id]||{};d+=[0,1,2].filter(i=>x[i]).length});D.tut.forEach(t=>{if(S.s[t.id])d++});
 const q=Math.round(d/n*100);pct.textContent=q+"%";cnt.textContent=d+" dari "+n+" ceklis";pb.style.width=q+"%"}
function step(x){return x.startsWith("$ ")?'<pre class="cmd" data-c="'+E(x.slice(2))+'" title="Ketuk untuk menyalin">'+E(x.slice(2))+"</pre>":"<li>"+E(x)+"</li>"}
function steps(a){let h="",o=[];a.forEach(x=>{if(x.startsWith("$ ")){if(o.length){h+="<ol>"+o.join("")+"</ol>";o=[]}h+=step(x)}else o.push(step(x))});return h+(o.length?"<ol>"+o.join("")+"</ol>":"")}
function card(p){const x=S.p[p.id]||{},ok=[0,1,2].every(i=>x[i]);
 return '<div class="g c '+(ok?"done ":"")+(O[p.id]?"open":"")+'" data-id="'+p.id+'"><div class="t" data-o="'+p.id+'"><b>'+(D.prompts.indexOf(p)+1)+". "+E(p.id)+" · "+E(p.title)+'<div class="m">'+E(D.acc[p.acc])+(p.branch?" · branch "+E(p.branch):"")+'</div></div><span class="tag">'+p.acc+'</span><button class="p" data-cp="'+p.id+'">Salin</button></div>'+
 '<div class="ck">'+L.map((l,i)=>'<label><input type="checkbox" data-p="'+p.id+'" data-i="'+i+'"'+(x[i]?" checked":"")+">"+l+"</label>").join("")+"</div>"+
 '<div class="d"><div class="m"><b>Prasyarat:</b> '+E(p.pre||"-")+"</div>"+steps(p.steps)+'<div class="row"><button class="p" data-cp="'+p.id+'">Salin prompt</button></div><pre>'+E(p.body)+"</pre></div></div>"}
function road(){let h=nxt()+'<div class="row chips">'+["all","P1","P2","P3","P4","P5"].map(a=>'<button class="'+(flt==a?"on":"")+'" data-f="'+a+'">'+(a=="all"?"Semua":a+" · "+D.acc[a])+"</button>").join("")+"</div>";
 D.waves.forEach((w,i)=>{const l=D.prompts.filter(p=>p.wave==i&&(flt=="all"||p.acc==flt));if(l.length)h+="<h2>"+E(w)+"</h2>"+l.map(card).join("")});return h}
function setup(){return '<div class="g c"><b>Pengaturan (isi sekali)</b><div class="m">Dipakai otomatis di KONTRAK saat prompt disalin.</div><input data-cfg="n" placeholder="Nama project Supabase (mis. devhub)" value="'+E((S.cfg||{}).n||"")+'"><input data-cfg="i" placeholder="Reference ID project Supabase" value="'+E((S.cfg||{}).i||"")+'"></div><div class="g c"><div class="row"><b>Salin KONTRAK (cadangan)</b><span style="flex:1"></span><button class="p" data-k="1">Salin KONTRAK</button></div><div class="m">KONTRAK sudah ikut otomatis di setiap prompt yang disalin. Tombol ini hanya cadangan.</div></div>'+
 D.tut.map(t=>'<div class="g c '+(S.s[t.id]?"done ":"")+(O[t.id]?"open":"")+'"><div class="t" data-o="'+t.id+'"><input type="checkbox" data-s="'+t.id+'"'+(S.s[t.id]?" checked":"")+'><b>'+E(t.t)+'<div class="m">'+E(t.who)+" · "+E(t.when)+'</div></b><span class="tag '+(t.req=="WAJIB"?"w1":"")+'">'+t.req+'</span></div><div class="d">'+steps(t.steps)+"</div></div>").join("")}
function tut(){return "<h2>Alur tiap prompt</h2><div class='g c'><ol>"+D.rit.map(x=>"<li>"+E(x)+"</li>").join("")+"</ol></div><h2>Kalau ada masalah</h2>"+D.faq.map(f=>"<div class='g c'><b>"+E(f[0])+"</b><div class='m'>"+E(f[1])+"</div></div>").join("")+"<h2>Cara pakai website ini</h2><div class='g c'><ol><li>Kerjakan tab Persiapan dan isi kotak Pengaturan.</li><li>Di Roadmap, kartu Berikutnya menunjukkan prompt yang dikerjakan. Tekan Salin prompt.</li><li>Buka chat BARU di Claude, tempel, dan ikuti langkah di kartu.</li><li>Menyalin otomatis mencentang Prompt dikirim. Centang dua lainnya setelah tes lolos.</li></ol></div>"}
function draw(){tabs.innerHTML=[["r","Roadmap"],["s","Persiapan"],["t","Tutorial"]].map(a=>'<button class="'+(tab==a[0]?"on":"")+'" data-t="'+a[0]+'">'+a[1]+"</button>").join("");
 v.innerHTML=tab=="r"?road():tab=="s"?setup():tut();prog()}
document.addEventListener("click",e=>{const g=a=>e.target.closest("["+a+"]");let x;
 if(x=g("data-t")){tab=x.dataset.t;draw()}else if(x=g("data-f")){flt=x.dataset.f;draw()}
 else if(x=g("data-cp")){doCopy(x.dataset.cp)}
 else if(g("data-k")){cp(kt());toast("KONTRAK tersalin")}
 else if(x=g("data-c")){cp(x.dataset.c);x.style.borderColor="var(--ok)"}
 else if((x=g("data-o"))&&!e.target.matches("input")){const i=x.dataset.o;O[i]=!O[i];x.parentElement.classList.toggle("open",O[i])}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.cfg){S.cfg=S.cfg||{};S.cfg[t.dataset.cfg]=t.value.trim();sv()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.p){const o=S.p[t.dataset.p]=S.p[t.dataset.p]||{};o[t.dataset.i]=t.checked}else if(t.dataset.s)S.s[t.dataset.s]=t.checked;else return;sv();draw();toast("Tersimpan di browser ini")});
ex.onclick=()=>{const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="progress.json";a.click();toast("progress.json diunduh. Upload ke repo, satu folder dengan index.html.")};
im.onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);S.p=S.p||{};S.s=S.s||{};sv();draw()}catch(e){alert("File tidak valid")}};r.readAsText(i.files[0])};i.click()};
im.title="Impor progress.json";rs.onclick=()=>{if(confirm("Hapus semua ceklis?")){S={p:{},s:{}};sv();draw()}};
draw();
if(!has(S))fetch("progress.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.p&&!has(S)){S=j;S.p=S.p||{};S.s=S.s||{};sv();draw();toast("Progress dimuat dari progress.json")}}).catch(()=>{});
</script></body></html>
