DEVHUB v9.1 - LANJUTAN (revisi: pemandu Gemini, memori Supabase+Vercel, perbaikan prompt)
Satu orang, satu urutan, 7 akun Claude bergantian, dipandu Gemini. Claude menulis ke Supabase dan Vercel lewat konektor. Lanjutan dari v8 (semua prompt v8 harus sudah selesai). Isi sama dengan roadmap di index.html.
Pembagian akun (saran, ganti akun SEBELUM jatah habis; jatah gratis reset berkala): prompt BERAT 1-2 per akun, prompt kursus 2-3 per akun. Roadmap menghitung saran akun otomatis.
Nama file ini: devhub_prompts_v9.1.txt

== PETUNJUK UNTUK GEMINI ==
PERAN: Kamu pemandu proyek. Pengguna membangun DevHub v2 dengan menjalankan 35 prompt (N01-N35) di chat Claude, di banyak akun Claude bergantian. Kamu TIDAK menulis kode situs dan TIDAK menjalankan apa pun. Tugasmu: menuntun urutan, akun, tes, dan penanganan masalah, selangkah demi selangkah.
SUMBER KEBENARAN: file ini. Bila ingatanmu bertentangan dengan file, ikuti file. Jangan mengarang isi prompt.
PEMBUKA (sekali, di awal): baca seluruh file, ringkas 5 baris, lalu tanyakan SATU hal: "Sudah sampai prompt mana dan akun Claude mana yang aktif?". Bila pengguna menempel blok STATUS, pakai itu.
GAYA: bahasa Indonesia, ramah, singkat, nyaman di layar HP (maks sekitar 8 baris per balasan). Satu langkah per giliran, tunggu konfirmasi. Jangan membanjiri semua langkah sekaligus.
SETIAP PROMPT, lakukan urutan ini:
1. Umumkan: ID, judul, tahap, jenis (berat/ringan/kursus), apakah ada deploy, akun saran. Cek prasyarat; bila belum terpenuhi, jelaskan dan arahkan ke prompt yang benar. (Prompt kursus N20-N34 hanya butuh N19 dan boleh dikerjakan dalam urutan apa pun.)
2. Cek akun: jatah akun aktif cukup untuk tugas ini? Bila prompt BERAT, sarankan akun dengan jatah penuh. Bila akun baru: jalankan CEK GANTI AKUN di bawah.
3. Beri teks prompt lengkap dalam SATU blok kode agar mudah disalin: KONTRAK (plus KONTRAK KURSUS bila jenis kursus), lalu baris "TUGAS [ID] judul", lalu isi prompt. Ganti <NAMA-DEV>, <ID-DEV>, <TEAM-VERCEL>, <EMAIL-PENGIRIM> dengan data pengguna. Bila data belum ada, minta dulu. Alternatif: pengguna memakai tombol Salin prompt di roadmap.
4. Tuntun bagian "Langkah:" satu per satu: chat BARU di Claude, tempel, setujui SQL dan konektor, buka alamat situs, jalankan tiap TES.
5. Minta pengguna menempel LAPORAN AKHIR Claude (maks 8 baris, baris terakhir "STATUS: ..."). Cocokkan dengan yang diharapkan. Kamu tidak bisa melihat chat Claude; hanya yang ditempel pengguna.
6. Gagal: minta pesan error persis atau tangkapan layar, cari penyebab, lalu tulis pesan koreksi singkat untuk ditempel ke chat Claude yang SAMA. Rujuk bagian MASALAH UMUM. Jangan menyuruh mengulang dari awal.
7. Lolos: minta pengguna mencentang kartu di roadmap, catat "N## selesai", sebutkan prompt berikutnya dan akunnya.
CEK GANTI AKUN: (a) konektor Supabase dan Vercel terhubung di akun itu, (b) uji: "daftar project Supabase dan Vercel" berhasil, (c) buka chat BARU. Bila tugas sebelumnya belum selesai di akun lama, beri PROMPT LANJUT: semua teks prompt yang sama + KONTRAK + kalimat "LANJUT: tugas ini sudah sebagian dikerjakan di chat atau akun sebelumnya. Baca memori sesuai [MEMORI], cek apa yang sudah ada, selesaikan HANYA bagian yang belum, jangan ulang migrasi yang sudah ada." (roadmap punya tombol Salin prompt lanjut). Chat Claude baru TIDAK mengingat apa pun; ingatan proyek ada di Supabase (dev_prompt_log, dev_notes) dan Vercel (meta deployment dan assets/MEMORY.md) sesuai [MEMORI].
PELACAK STATUS: simpan di percakapan: prompt selesai, prompt berikutnya, akun aktif dan jumlah prompt yang sudah dijalankan di akun itu, masalah terbuka. Akhiri balasan penting dengan satu baris "STATUS: selesai N01-N0x | berikutnya N0y | akun X". Setelah tiap 5 prompt, atau bila diminta, cetak blok "STATUS DEVHUB v9.1" agar bisa ditempel ke chat Gemini baru.
KEAMANAN: jangan pernah meminta atau menampung App Password, API key, service_role, atau password akun. Bila pengguna menempelkannya, ingatkan segera untuk menggantinya (rotate). Rahasia hanya diisi pengguna di dashboard Supabase Secrets.
BATAS: jangan menyuruh melompati prasyarat, mengubah KONTRAK, memakai AI selain Groq di /ai, atau menjalankan perintah merusak (DROP, TRUNCATE, DELETE tanpa WHERE, hapus project). Bila Claude menolak atau terpotong, bantu dengan "lanjut" atau rollback sesuai MASALAH UMUM.
RILIS: setelah N34 jalankan N35 (audit). Bila ada temuan, tuntun perbaikannya sebelum menyatakan selesai.

== PERSIAPAN ==
Catatan: S1-S5 berasal dari v8 (project Supabase dev, project Vercel "devhub", konektor Supabase dan Vercel terhubung, secret yang sudah ada seperti GROQ_API_KEY) dan dianggap SUDAH SELESAI. Bila ragu, N01 meminta Claude memeriksa kondisi v8.

S6 Siapkan Gemini sebagai pemandu [SEKALI | WAJIB | Sebelum N01]
  - Buka gemini.google.com. Buat Gem baru (atau chat baru). Instruksi Gem = tombol Salin petunjuk di tab Gemini pada roadmap. Tanpa Gem, tempel petunjuk itu sebagai pesan pertama.
  - Unggah file devhub_prompts_v9.1.txt (tombol Unduh di tab Gemini) sebagai file pengetahuan atau lampiran.
  - Kirim pesan pembuka dari roadmap (tombol Salin pesan pembuka). Gemini merangkum dan menanyakan posisimu.
  - Beri label akun Claude A sampai G. Jangan tulis email atau password akun di chat.
S7 SMTP Gmail untuk email kode verifikasi [SEKALI | WAJIB | Sebelum N03]
  - Login ke akun Google <EMAIL-PENGIRIM> > Keamanan > aktifkan Verifikasi 2 Langkah.
  - Keamanan > Sandi aplikasi (App passwords) > buat nama devhub > salin 16 karakter (tampil sekali). Simpan di catatan HP, JANGAN tempel ke chat Claude.
  - Supabase > Authentication > Emails > SMTP Settings (nama menu bisa berbeda): aktifkan Custom SMTP. Host smtp.gmail.com, Port 465, Username <EMAIL-PENGIRIM>, Password = sandi aplikasi, Sender email <EMAIL-PENGIRIM>, Sender name DevHub. Simpan.
  - Authentication > Rate Limits: naikkan batas email per jam bila ada (Gmail pribadi sekitar 500 email per hari).
  - Template email dan Confirm email diatur saat N03 (Claude memberi langkahnya).

S8 TURN untuk telepon suara [SEKALI | OPSIONAL | Sebelum N12]
  - Tanpa TURN, telepon tetap jalan di sebagian besar jaringan. Di jaringan tertentu (seluler tertentu atau kantor) suara bisa tidak tembus; saat itu baru perlu TURN.
  - Bila perlu: daftar layanan TURN gratis (mis. metered.ca, cek batas gratis terbaru), salin API key. Simpan sebagai secret TURN_API_KEY di Supabase > Edge Functions > Secrets saat Claude memintanya. Jangan tempel key ke chat.

S9 Pasang roadmap di GitHub Pages [SEKALI | OPSIONAL | Kapan saja]
  - Roadmap (index.html) sudah berisi seluruh prompt dan bisa dibuka langsung dari file di HP. Bila ingin alamat tetap: buka github.com > repository "web" (etgn.github.io/web) > Add file > Upload files, unggah index.html, lalu Commit changes.
  - Tunggu 1-2 menit, buka alamat Pages di browser: roadmap harus tampil.
  - Kemajuan (centang) tersimpan di browser per perangkat. Gunakan satu browser yang sama.

== ALUR TIAP PROMPT ==
1. Buka chat BARU di Claude (kartu Berikutnya di Roadmap, akun sesuai saran Gemini).
2. Tekan Salin prompt dan tempel. KONTRAK sudah ikut di dalamnya.
3. Bila Claude menampilkan ringkasan SQL, balas ya. Ketuk Izinkan pada permintaan konektor.
4. Claude men-deploy dan memberi alamat. Buka di browser HP dan lakukan TES di kartu (juga di layar lebih lebar).
5. Gagal: tempel pesan error atau deskripsi masalah di chat yang sama. Lolos: centang kartu.
6. Tempel laporan akhir Claude ke Gemini, lalu lanjut ke prompt berikutnya di chat baru.

== MASALAH UMUM ==
- Claude terpotong atau berhenti: Ketik: lanjut
- Batas pemakaian gratis habis: Ganti ke akun Claude lain SEBELUM habis (hubungkan Supabase dan Vercel lagi, uji daftar project). Di chat baru tempel Prompt lanjut (tombol di roadmap atau dari Gemini): berisi KONTRAK + prompt + perintah membaca memori.
- Halaman lama hilang setelah deploy: Claude lupa menyertakan file lama. Minta: rollback ke deployment sebelumnya, lalu ulangi dan tekankan aturan Vercel di KONTRAK.
- Tampilan rusak di HP setelah rombak: tempel tangkapan layar atau deskripsi di chat yang sama, atau minta rollback.
- Email kode tidak masuk: cek folder spam, cek SMTP (S7), cek batas email per jam di Supabase.
- Suara telepon tidak terdengar: cek izin mikrofon, coba jaringan lain, atau lakukan S8 (TURN).
- Situs minta login Vercel: Matikan Deployment Protection untuk Production.
- Konektor tidak muncul atau ditolak: Hubungkan ulang di Connectors dan uji lagi.
- Perlu akun uji kedua dan ketiga: Pakai tab penyamaran dan browser lain di HP, email berbeda.

== KONTRAK (ikut di setiap prompt) ==
KONTRAK DEVHUB v9.1 (taati di semua tugas)
Tugas saya = bagian TUGAS di bawah. Ubah hanya file yang disebut di tugas; file lain dipertahankan persis.

[PROYEK] DevHub v2: situs komunitas developer gratis. Statis TANPA build: HTML + CSS + JavaScript (ES module). Pustaka lewat CDN dengan versi dipatok (rilis berumur lebih dari 14 hari). Backend: Supabase (Auth, Postgres + RLS, Storage, Realtime, Edge Functions). Hosting: Vercel (satu project "devhub"). Bahasa antarmuka Indonesia.

[DESAIN] Modern, bersih, rapi, tidak membingungkan.
- Satu sistem desain dari assets/app.css (token warna, jarak, radius, bayangan, tipografi; gelap/terang). Pakai komponen .card .btn .input .chip .badge .tabs .modal .drawer .empty .skeleton .avatar; hindari gaya inline berantakan.
- Adaptif per ukuran layar, mobile-first: di bawah 640px = bar tab bawah + satu kolom; 640-1023px = rail ikon + dua kolom; 1024px ke atas = sidebar penuh + konten + panel samping bila perlu. Tata letak benar-benar berbeda per kelas layar, bukan sekadar mengecil.
- Satu aksi utama per layar, judul jelas, keadaan kosong yang ramah, skeleton saat memuat, pesan error manusiawi.
- Target sentuh min 44px, kontras cukup, fokus terlihat, hormati prefers-reduced-motion. Ikon SVG inline, bukan emoji.

[ANTARMUKA TETAP]
- assets/supabase.js mengekspor sb dan getUser(). assets/ui.js mengekspor mountNav(), toast(msg), esc(teks); boleh menambah ekspor baru, jangan menghapus. Halaman memakai <script type="module"> dan import dari /assets/.
- Tabel lama dipertahankan. Migrasi hanya MENAMBAH (tabel baru, ALTER ADD); data lama tidak boleh hilang (pindahkan dengan INSERT ... SELECT). Kolom pemilik: user_id default auth.uid(). Semua tabel: RLS aktif sejak dibuat dan policy jelas. Fungsi pembantu RLS: SECURITY DEFINER dengan search_path tetap, hindari rekursi policy.
- Identitas: tiap akun punya username dan ID akun (user_code) unik untuk dicari orang lain.
- AI: satu-satunya layanan AI adalah Groq, hanya untuk obrolan teks di /ai. AI tidak boleh dihubungkan ke runner kode, tools, atau fitur lain.
- Email verifikasi lewat SMTP kustom yang sudah saya atur sendiri (pengirim <EMAIL-PENGIRIM>). Jangan pernah meminta atau menulis App Password atau API key di chat.

[ATURAN SUPABASE] Project "<NAMA-DEV>" (id: <ID-DEV>) SAJA.
- Jalankan SQL lewat apply_migration, nama bernomor melanjutkan migrasi terakhir (cek list_migrations), idempoten bila bisa. Tampilkan ringkasan SQL (maks 10 baris) dan tunggu saya menjawab "ya".
- DILARANG: DROP, TRUNCATE, DELETE tanpa WHERE, membuat/menghapus project.
- Setelah migrasi jalankan get_advisors (security) dan perbaiki peringatan RLS.
- Di front-end hanya publishable/anon key. service_role dan rahasia lain JANGAN masuk file atau chat. Rahasia hanya di Edge Function lewat Supabase Secrets (saya isi di dashboard).
- Edge Function: deploy_edge_function, verify_jwt true kecuali endpoint publik yang memverifikasi key sendiri.
- Realtime untuk data privat: channel privat dengan policy pada realtime.messages, dan tabel yang dipantau punya RLS.
- Memori proyek: wajib dibaca di awal dan ditulis di akhir tugas sesuai [MEMORI].

[ATURAN VERCEL] Project "devhub" SAJA (team: <TEAM-VERCEL>; bila kosong, cari lewat list_teams).
- Deploy = create_deployment, target production, framework null (statis).
- Setiap deploy HARUS memuat SEMUA file yang sudah ada. Sebelum deploy: list_deployments (production terakhir), list_deployment_files, pertahankan file yang tidak kamu ubah dengan referensi sha dan size tanpa membaca isinya; baca isi hanya bila sha tidak tersedia. Ubah hanya file milik tugas.
- Kelompokkan modul besar dalam sedikit file. Jangan mengubah env, domain, atau setting. Deploy gagal: baca log, perbaiki; bila perlu request_rollback.
- Setiap deploy: isi meta dan perbarui assets/MEMORY.md sesuai [MEMORI] (pengecualian dari "ubah hanya file tugas").
- Setelah deploy berikan alamat situs.

[MEMORI] Ingatan proyek lintas chat dan akun. Wajib: chat Claude baru tidak mengingat apa pun.
AWAL tugas (hemat, 3 langkah):
1. execute_sql: SELECT prompt_id,status,summary,needs FROM dev_prompt_log ORDER BY started_at; SELECT module,note FROM dev_notes ORDER BY module;
2. list_deployments (production terakhir), lalu get_deployment: baca meta devhub_memory dan devhub_done.
3. list_deployment_files. Baca assets/MEMORY.md hanya bila perlu.
Tabel belum ada (sebelum N01): lewati. Supabase dan Vercel berbeda: pakai yang lebih baru, catat selisih, lanjut. dev_prompt_log menandai tugas ini 'partial': lanjutkan dari bagian yang belum. Mulai tugas: upsert dev_prompt_log(prompt_id, title, status='started').
AKHIR tugas:
a. Supabase: upsert dev_prompt_log (status done/partial/failed, summary maks 8 baris, tables_added, files_changed, functions_added, needs, deployment_id, finished_at). dev_notes(module=<modul tugas>) maks 8 baris: UPDATE bila ada, INSERT bila tidak. Perbarui dev_notes module='_inti' (maks 20 baris: tabel, halaman, ekspor kunci, Edge Function, BUTUH dari tahap lain).
b. Vercel (hanya tugas dengan deploy): create_deployment dengan meta {"devhub_prompt":"<ID>","devhub_done":"<ID selesai dipisah koma>","devhub_memory":"<ringkasan maks 1500 karakter>"} dan perbarui assets/MEMORY.md (maks 60 baris: halaman dan path, file modul dan ekspor, tabel, prompt selesai, BUTUH).
c. Isi memori tanpa rahasia, tanpa data pengguna, tanpa email.
Skema dev_prompt_log (dibuat di N01, RLS aktif TANPA policy untuk anon/authenticated karena hanya dibaca lewat konektor): prompt_id text primary key, title text, status text check in ('started','partial','done','failed'), summary text, tables_added text[], files_changed text[], functions_added text[], needs text, deployment_id text, started_at timestamptz default now(), finished_at timestamptz.

[ATURAN JAWABAN]
Kerjakan sendiri lewat konektor. Hemat token: jangan menulis ulang isi file di chat, jangan membaca ulang file yang tidak perlu. Jangan bertanya balik kecuali buntu: putuskan sesuai kontrak dan catat asumsi. Laporan akhir maks 8 baris, lalu satu baris terakhir persis: STATUS: <ID> <done|partial|failed> | berikutnya: <ID>.
[AKHIR KONTRAK]

== KONTRAK KURSUS (ikut di prompt kursus N20-N34, setelah KONTRAK) ==
KONTRAK KURSUS (tambahan untuk prompt kursus)
- Cek skema courses dan lessons (list_tables verbose), ikuti kolom yang ada (mis. title, isi, sort, course_id), baca judul pelajaran lama, dan pastikan ada kunci unik (course_id, sort) untuk upsert.
- Tulis silabus lebih dulu, tampilkan, simpan ke dev_notes(module='kursus-<slug>'), lalu TUNGGU saya menjawab "setuju".
- Lalu 4 pelajaran per migrasi data: INSERT ... ON CONFLICT DO UPDATE ke lessons (course_id dari slug; sort melanjutkan nomor terakhir). Berhenti tiap batch sampai saya mengetik "lanjut".
- Tiap pelajaran 300-450 kata, bahasa Indonesia ramah pemula, urut dari dasar ke mahir, contoh kode sesuai tugas, bagian "Latihan" berisi 3 soal, dan 3 soal kuis pilihan ganda di kolom quiz jsonb: [{"q":"...","options":["..."],"answer":0,"why":"..."}] (answer = indeks mulai 0).
- Bila baris kursus belum ada di courses, tambahkan dulu. Setelah batch pertama set courses.status = 'published'.
- Setelah tiap batch: update dev_prompt_log status 'partial' (batch n/m dan nomor pelajaran terakhir); di akhir 'done'. Tidak ada deploy; hanya Supabase.

function steps(p){return p.steps.map((s,i)=>{const k=p.id+':'+i,c=S.st[k];return '<label class="s'+(c?' x':'')+'"><input type="checkbox" data-s="'+k+'"'+(c?' checked':'')+'><span>'+esc(s)+'</span></label>'}).join('')}
function acts(p){return '<div class="row"><button class="btn p" data-cp="'+p.id+'">Salin prompt</button><button class="btn" data-cr="'+p.id+'">Salin prompt lanjut</button><button class="btn" data-dn="'+p.id+'">'+(S.done[p.id]?'Batalkan selesai':'Tandai selesai')+'</button></div>'}
function card(p){const o=S.open[p.id];return '<article class="c'+(S.done[p.id]?' d':'')+'" id="'+p.id+'"><div class="h" data-o="'+p.id+'" role="button" tabindex="0" aria-expanded="'+!!o+'"><div><small>'+p.id+'</small><h3>'+esc(p.title)+'</h3>'+badges(p)+'</div><span aria-hidden="true">'+(o?'▾':'▸')+'</span></div>'+(o?'<div class="cb"><p class="mu">Prasyarat: '+esc(p.pre)+'</p>'+acts(p)+'<h2>Langkah</h2>'+steps(p)+'<details><summary>Lihat teks prompt</summary><pre>'+esc(p.text)+'</pre></details></div>':'')+'</article>'}
function tahapList(){const t={};P.forEach(p=>{(t[p.tahap]=t[p.tahap]||[]).push(p)});return t}
function side(){return Object.entries(tahapList()).map(([k,a])=>{const d=a.filter(p=>S.done[p.id]).length;return '<div><small>'+esc(k)+' · '+d+'/'+a.length+'</small><div class="pb"><i style="width:'+d/a.length*100+'%"></i></div></div>'}).join('')}
function vP(){const n=nextP(),q=S.q.toLowerCase();let h='';
h+=n?'<section class="box nx"><small>Berikutnya · '+n.id+' · saran akun '+n.acc+' (putaran '+n.rd+')</small><h3 style="font-size:1.2rem">'+esc(n.title)+'</h3>'+badges(n)+'<p class="mu">Prasyarat: '+esc(n.pre)+'</p><button class="btn p big" data-cp="'+n.id+'">Salin prompt</button><div class="row"><button class="btn" data-cr="'+n.id+'">Prompt lanjut</button><button class="btn" data-dn="'+n.id+'">Tandai selesai</button><button class="btn" data-o="'+n.id+'">Langkah</button></div></section>':'<section class="box nx"><h3>Semua prompt selesai</h3><p>Jalankan audit N35 bila belum, lalu rilis.</p></section>';
h+='<details class="box" style="margin-top:1rem"><summary>Pengaturan (isi sekali)</summary><div class="fg"><label>Nama project Supabase<input class="in" data-set="nama" value="'+esc(S.set.nama||'')+'" autocomplete="off"></label><label>Reference ID Supabase<input class="in" data-set="id" value="'+esc(S.set.id||'')+'" autocomplete="off"></label><label>Team Vercel (slug/ID, boleh kosong)<input class="in" data-set="team" value="'+esc(S.set.team||'')+'" autocomplete="off"></label><label>Email pengirim SMTP<input class="in" data-set="email" value="'+esc(S.set.email||'')+'" autocomplete="off"></label><label>Akun Claude aktif<select class="in" data-acc>'+[...ACC].map(a=>'<option'+(a==S.acc?' selected':'')+'>'+a+'</option>').join('')+'</select></label></div><p class="mu">Data hanya tersimpan di browser ini. Jangan isi password atau API key.</p></details>';
h+='<div class="f" role="group" aria-label="Filter">'+[['all','Semua'],['todo','Belum'],['done','Selesai']].map(([k,l])=>'<button class="btn" data-f="'+k+'" aria-pressed="'+(S.f==k)+'">'+l+'</button>').join('')+'<input type="search" id="q" placeholder="Cari prompt…" value="'+esc(S.q)+'" aria-label="Cari"></div>';
Object.entries(tahapList()).forEach(([k,a])=>{const l=a.filter(p=>(S.f=='all'||(S.f=='done')==!!S.done[p.id])&&(!q||(p.id+' '+p.title+' '+p.text).toLowerCase().includes(q)));if(!l.length)return;const d=a.filter(p=>S.done[p.id]).length;h+='<h2>'+esc(k)+' <small>'+d+'/'+a.length+'</small></h2>'+l.map(card).join('')});return h}
function vR(){return '<p class="mu">'+esc(PREPNOTE)+'</p>'+PR.map(p=>'<article class="c"><div class="cb" style="padding-top:.8rem"><small>'+p.id+' · '+esc(p.meta)+'</small><h3>'+esc(p.title)+'</h3>'+p.steps.map((s,i)=>{const k='S:'+p.id,c=S.st[k+i];return '<label class="s'+(c?' x':'')+'"><input type="checkbox" data-s="'+k+i+'"'+(c?' checked':'')+'><span>'+esc(s)+'</span></label>'}).join('')+'<div class="row"><button class="btn" data-ds="'+p.id+'">'+(S.st['S:'+p.id]?'Batalkan selesai':'Tandai persiapan selesai')+'</button></div></div></article>').join('')}
function vG(){return '<section class="box"><h3>Pakai Gemini sebagai pemandu</h3><ol><li>Salin petunjuk, jadikan Instruksi Gem baru (atau pesan pertama di chat).</li><li>Unduh file txt, unggah ke Gemini.</li><li>Kirim pesan pembuka. Setelah itu ikuti arahan Gemini.</li><li>Tiap selesai prompt, tempel laporan akhir Claude ke Gemini. Kirim "Salin status" bila membuka chat Gemini baru.</li></ol><div class="row"><button class="btn p" data-g="gem">Salin petunjuk Gemini</button><button class="btn" data-g="open">Salin pesan pembuka</button><button class="btn" data-g="st">Salin status</button><button class="btn" data-g="dl">Unduh file txt</button></div></section><h2>Petunjuk yang dibaca Gemini</h2><pre>'+esc(GEM)+'</pre>'}
function vB(){return '<h2>Alur tiap prompt</h2><pre>'+esc(ALUR)+'</pre><h2>Masalah umum</h2><pre>'+esc(MAS)+'</pre><h2>Kontrak (ikut di setiap prompt)</h2><details><summary>Lihat kontrak</summary><pre>'+esc(K)+'</pre></details><details><summary>Kontrak kursus</summary><pre>'+esc(KK)+'</pre></details><div class="row"><button class="btn" data-g="reset">Reset progres di browser ini</button></div>'}
function render(){const T=[['p','Prompt'],['r','Persiapan'],['g','Gemini'],['b','Bantuan']];$('#tabs').innerHTML=T.map(([k,l])=>'<button data-t="'+k+'"'+(S.tab==k?' aria-current="page"':'')+'>'+l+'</button>').join('');
const d=doneN();$('#pg').textContent=d+'/'+P.length+' selesai';$('#bar').style.width=d/P.length*100+'%';
$('#app').innerHTML='<div class="g"><aside class="side box"><b>Progres per tahap</b><div style="margin-top:.6rem">'+side()+'</div></aside><div>'+({p:vP,r:vR,g:vG,b:vB}[S.tab])()+'</div></div>'}
const ids=id=>P.find(p=>p.id==id);
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-o],[data-cp],[data-cr],[data-dn],[data-ds],[data-f],[data-g]');if(!t)return;const D=t.dataset;
if(D.t){S.tab=D.t;scrollTo(0,0)}else if(D.o){S.open[D.o]=!S.open[D.o]}else if(D.cp){copy(full(ids(D.cp)),'Prompt '+D.cp+' tersalin');return}else if(D.cr){copy(resume(ids(D.cr)),'Prompt lanjut '+D.cr+' tersalin');return}
else if(D.dn){S.done[D.dn]=!S.done[D.dn];if(S.done[D.dn]){const n=nextP();if(n)toast('Berikutnya: '+n.id)}}else if(D.ds){S.st['S:'+D.ds]=!S.st['S:'+D.ds]}else if(D.f){S.f=D.f}
else if(D.g=='gem'){copy(GEM,'Petunjuk Gemini tersalin');return}else if(D.g=='open'){copy('Halo Gemini. Baca file devhub_prompts_v9.1.txt yang saya lampirkan, lalu jadilah pemandu saya sesuai bagian PETUNJUK UNTUK GEMINI. Ringkas dulu dalam 5 baris, lalu tanyakan posisi saya sekarang.\n\n'+status(),'Pesan pembuka tersalin');return}
else if(D.g=='st'){copy(status(),'Status tersalin');return}else if(D.g=='dl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([RAW],{type:'text/plain'}));a.download='devhub_prompts_v9.1.txt';a.click();return}
else if(D.g=='reset'){if(confirm('Hapus semua centang dan pengaturan di browser ini?')){S={done:{},st:{},set:{},acc:'A',tab:'p',f:'all',q:'',open:{}};}else return}
save();render()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.s){S.st[t.dataset.s]=t.checked;const id=t.dataset.s.split(':')[0],p=ids(id);if(p&&t.checked&&p.steps.every((_,i)=>S.st[id+':'+i])&&!S.done[id]){S.done[id]=true;toast(id+' ditandai selesai')}}else if(t.dataset.set){S.set[t.dataset.set]=t.value}else if('acc' in t.dataset){S.acc=t.value}else return;save();render()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;save();render();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.dataset&&e.target.dataset.o){e.preventDefault();e.target.click()}});
if(!P.length)document.getElementById('app').innerHTML='<p class="box">Isi file tidak terbaca. Unduh ulang index.html.</p>';else render();
</script></body></html>
